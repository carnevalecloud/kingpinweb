name: kingpinweb
type: generic
docroot: dist
webserver_type: nginx-fpm
xdebug_enabled: false
omit_containers: [db]
nodejs_version: "24.14.0"
corepack_enable: false
ddev_version_constraint: ">= 1.25.0"
web_extra_exposed_ports:
  - name: vite
    container_port: 5173
    http_port: 5174
    https_port: 5173
hooks:
  pre-start:
    - exec-host: mkdir -p dist

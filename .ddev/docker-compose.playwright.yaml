# Browser test runner. The image version must match @playwright/test in package.json.
services:
  playwright:
    container_name: ddev-${DDEV_SITENAME}-playwright
    image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    command: ["sleep", "infinity"]
    user: "${DDEV_UID}:${DDEV_GID}"
    working_dir: /var/www/html
    ipc: host
    environment:
      HOME: /tmp
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    volumes:
      - "../:/var/www/html"
      # DDEV runs this service's custom commands from here.
      - ".:/mnt/ddev_config:ro"
